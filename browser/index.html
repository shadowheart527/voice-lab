<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17171c">
<title>voice-lab</title>
<style>
:root {
  --bg: #fbfafc; --panel: #ffffff; --ink: #1d1a24; --muted: #6c6678;
  --line: #e2dee8; --accent: #8a5cd0; --good: #2e9e5b;
  --chart-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141319; --panel: #1e1c25; --ink: #eae7f0; --muted: #9a94a6;
          --line: #302c3b; --accent: #b492f0; --chart-bg: #fdfdfb; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; overscroll-behavior: none; }

header { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem;
  padding-top: max(.6rem, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
h1 { font: 600 1rem/1 system-ui; margin: 0; letter-spacing: .02em; }
.spacer { flex: 1; }
button { font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: .4rem .9rem; cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
.tabs { display: flex; gap: .4rem; padding: .5rem .9rem 0; }
.tabs button { flex: 1; border-radius: 10px; padding: .5rem; }

main { flex: 1; display: flex; flex-direction: column; padding: .7rem .9rem 1rem;
  padding-bottom: max(1rem, env(safe-area-inset-bottom)); gap: .6rem; min-height: 0; }
.chartwrap { position: relative; background: var(--chart-bg); border-radius: 14px;
  box-shadow: 0 1px 10px rgba(0,0,0,.16); overflow: hidden; }
canvas { display: block; width: 100%; height: auto; }

.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
  gap: .5rem; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: .45rem .6rem; }
.stat .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: .7rem; font-weight: 400; color: var(--muted); }

.cell { text-align: center; padding: .5rem; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; }
.cell .code { font: 700 1.6rem/1 Georgia, serif; }
.cell .desc { font-size: .85rem; color: var(--muted); }

.note { font-size: .78rem; color: var(--muted); }
.warn { background: #f6e6b8; color: #4a3a08; border-radius: 8px; padding: .5rem .7rem;
  font-size: .8rem; }
@media (prefers-color-scheme: dark) { .warn { background: #4a3f18; color: #f3e5bb; } }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>voice&#8209;lab</h1>
  <span class="spacer"></span>
  <span class="note" id="status">idle</span>
  <button id="mic" class="primary">Start</button>
</header>

<div class="tabs">
  <button id="tabGender" aria-pressed="true">Genderspace</button>
  <button id="tabFullness" aria-pressed="false">Fullness</button>
</div>

<main>
  <div id="httpWarn" class="warn hidden">
    Microphone access needs a secure context. On a phone this page must be served
    over HTTPS (localhost is exempt). See docs/browser.md.
  </div>

  <div class="chartwrap">
    <canvas id="chart" width="1000" height="1000"></canvas>
  </div>

  <div id="genderReadout" class="readout">
    <div class="stat"><div class="k">Pitch</div><div class="v"><span id="vPitch">—</span> <small id="vNote"></small></div></div>
    <div class="stat"><div class="k">Resonance</div><div class="v" id="vRes">—</div></div>
    <div class="stat"><div class="k">Reads</div><div class="v" id="vReads" style="font-size:.95rem">—</div></div>
    <div class="stat"><div class="k">In target</div><div class="v" id="vInBand">—</div></div>
  </div>

  <div id="fullnessReadout" class="hidden">
    <div class="cell"><div class="code" id="fCode">—</div><div class="desc" id="fDesc">waiting for voice</div></div>
    <div class="readout" style="margin-top:.5rem">
      <div class="stat"><div class="k">Weight</div><div class="v" id="fWeight">—</div></div>
      <div class="stat"><div class="k">Size</div><div class="v" id="fSize">—</div></div>
      <div class="stat"><div class="k">Tilt</div><div class="v" id="fTilt">— <small>dB/oct</small></div></div>
    </div>
  </div>

  <div class="note" id="footnote">
    Runs entirely on your device; no audio leaves the browser.
  </div>
</main>

<script type="module" src="./src/app.js"></script>
</body>
</html>
